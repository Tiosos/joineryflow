name: CI

# Actions minutes are limited, so spend them only where code changed.
# Docs-only changes skip CI. For pull_request events GitHub applies the filter
# to the PR's *whole* diff, not the latest push: a PR that touches any code runs
# CI on every push, and only an all-docs PR skips. If branch
# protection ever *requires* these checks, a skipped run leaves them pending
# and blocks the merge — add an always-pass job for that case, don't drop this.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (pytest + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      # meili is named explicitly although `api` depends on it: the tests marked
      # `meili` run against it (MEILI_URL comes from .env.example). The
      # search-worker is deliberately NOT started — it would drain outbox rows
      # the tests count.
      - name: Build & start db + meili + api
        run: docker compose up -d --build db meili api

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U jf -d joineryflow; then
              echo "postgres ready"; exit 0
            fi
            echo "waiting for postgres ($i)…"; sleep 2
          done
          echo "postgres did not become ready"; docker compose logs db; exit 1

      - name: Apply migrations (alembic upgrade head)
        run: docker compose exec -T -w /db api alembic upgrade head

      - name: Seed reference + demo data
        # Populates the global lookup tables (stages, status_options,
        # status_symbols) that the suite's item inserts FK against. Tests only
        # truncate workspace-scoped tables, so these survive the run. Mirrors
        # the documented dev loop: migrate -> seed -> test.
        run: docker compose exec -T api python -m seed.hartwood_joinery

      - name: Run pytest
        run: docker compose exec -T api pytest -q

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

  web-typecheck:
    name: Web typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Generate next-env.d.ts
        working-directory: apps/web
        run: |
          test -f next-env.d.ts || printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      # tsc alone is not enough. Server/client boundary violations — a client
      # component importing a module that pulls in `next/headers`, for example
      # — are bundler errors, not type errors: tsc passes and the build fails.
      # That exact break shipped through this job once.
      - name: Build
        working-directory: apps/web
        run: pnpm build
