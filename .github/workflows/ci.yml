name: CI

# Actions minutes are limited, so spend them only where code changed.
# Docs-only changes skip CI. For pull_request events GitHub applies the filter
# to the PR's *whole* diff, not the latest push: a PR that touches any code runs
# CI on every push, and only an all-docs PR skips. If branch
# protection ever *requires* these checks, a skipped run leaves them pending
# and blocks the merge — add an always-pass job for that case, don't drop this.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (pytest + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      # meili is named explicitly although `api` depends on it: the tests marked
      # `meili` run against it (MEILI_URL comes from .env.example). The
      # search-worker is deliberately NOT started — it would drain outbox rows
      # the tests count.
      - name: Build & start db + meili + api
        run: docker compose up -d --build db meili api

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U jf -d joineryflow; then
              echo "postgres ready"; exit 0
            fi
            echo "waiting for postgres ($i)…"; sleep 2
          done
          echo "postgres did not become ready"; docker compose logs db; exit 1

      - name: Apply migrations (alembic upgrade head)
        run: docker compose exec -T -w /db api alembic upgrade head

      - name: Seed reference + demo data
        # Populates the global lookup tables (stages, status_options,
        # status_symbols) that the suite's item inserts FK against. Tests only
        # truncate workspace-scoped tables, so these survive the run. Mirrors
        # the documented dev loop: migrate -> seed -> test.
        run: docker compose exec -T api python -m seed.hartwood_joinery

      - name: Run pytest
        run: docker compose exec -T api pytest -q

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

  web-typecheck:
    name: Web typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Generate next-env.d.ts
        working-directory: apps/web
        run: |
          test -f next-env.d.ts || printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      # tsc alone is not enough. Server/client boundary violations — a client
      # component importing a module that pulls in `next/headers`, for example
      # — are bundler errors, not type errors: tsc passes and the build fails.
      # That exact break shipped through this job once.
      - name: Build
        working-directory: apps/web
        run: pnpm build

  # Whole Playwright suite against a real stack. ADVISORY: do not add this to
  # the required checks until it has run green for a while (see CLAUDE.md,
  # "e2e in CI"). The suite is not idempotent (estimating / procurement /
  # comments fail on a second run), so it must always start from a database
  # created, migrated and seeded in this job — which a fresh runner gives us.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      # search-worker is started AFTER the seed on purpose: the seed's writes
      # land in search_outbox and the worker then drains them, which is what
      # makes the two search specs find their records.
      - name: Build & start db + meili + api
        run: docker compose up -d --build db meili api

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U jf -d joineryflow; then
              echo "postgres ready"; exit 0
            fi
            echo "waiting for postgres ($i)…"; sleep 2
          done
          echo "postgres did not become ready"; docker compose logs db; exit 1

      - name: Apply migrations (alembic upgrade head)
        run: docker compose exec -T -w /db api alembic upgrade head

      - name: Seed reference + demo data
        run: docker compose exec -T api python -m seed.hartwood_joinery

      - name: Start search-worker and wait for the API
        run: |
          docker compose up -d search-worker
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q ok; then echo "api ready"; exit 0; fi
            echo "waiting for api ($i)…"; sleep 2
          done
          echo "api did not become ready"; docker compose logs api; exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # A production build served with `next start`: no on-demand compilation,
      # so the first navigation of each route is not a cold compile (the cause
      # of several click-before-hydration races seen against `next dev`).
      # NEXT_PUBLIC_* values are inlined at build time, so .env is exported
      # first; API_URL points at the published port instead of the compose name.
      - name: Build & start web
        working-directory: apps/web
        run: |
          set -a; . ../../.env; set +a
          export API_URL=http://localhost:8000
          pnpm build
          nohup pnpm exec next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200" ]; then echo "web ready"; exit 0; fi
            sleep 2
          done
          echo "web did not become ready"; cat /tmp/web.log; exit 1

      - name: Wait for the search index
        # Not fatal: the two search specs skip on 503, but a slow first index
        # should not turn them into skips when the stack is healthy.
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cj -H 'content-type: application/json' \
              -d '{"workspace_slug":"hartwood-joinery","email":"rin.park@hartwood.test","password":"hartwood-dev"}' http://localhost:3000/api/auth/login)
            hits=$(curl -s -b /tmp/cj 'http://localhost:3000/api/search?q=297830' | grep -c 297830 || true)
            if [ "$code" = "200" ] && [ "$hits" -gt 0 ]; then echo "search index ready"; exit 0; fi
            sleep 2
          done
          echo "search index not ready — search specs may skip"; exit 0

      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: apps/web
        env:
          CI: "true"
          PW_BASE_URL: http://localhost:3000
        run: pnpm exec playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump compose + web logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          echo "----- web -----"; cat /tmp/web.log || true
