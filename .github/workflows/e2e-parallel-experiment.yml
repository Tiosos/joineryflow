name: E2E parallel experiment

# NOT a required check and not part of CI. It answers one question for
# docs/sub-projects/10-e2e-speedup.md (item 5): which spec files still pass when files run
# in parallel (3 workers) on one database? It runs the whole suite twice on a fresh database
# with retries off, then lists the files that failed in either run. Files that pass both
# times can move to a parallel Playwright project; the rest stay serial.
#
# Run it by hand (Actions > E2E parallel experiment > Run workflow), or it runs on a PR that
# changes this file. The setup steps are copied from the e2e job in ci.yml: keep them in sync.
on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/e2e-parallel-experiment.yml", "scripts/playwright_failures.py"]

concurrency:
  group: e2e-parallel-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-parallel:
    name: E2E parallel experiment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      # search-worker is started AFTER the seed on purpose: the seed's writes
      # land in search_outbox and the worker then drains them, which is what
      # makes the two search specs find their records.
      - name: Build & start db + meili + api
        run: docker compose up -d --build db meili api

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U jf -d joineryflow; then
              echo "postgres ready"; exit 0
            fi
            echo "waiting for postgres ($i)…"; sleep 2
          done
          echo "postgres did not become ready"; docker compose logs db; exit 1

      - name: Apply migrations (alembic upgrade head)
        run: docker compose exec -T -w /db api alembic upgrade head

      - name: Seed reference + demo data
        run: docker compose exec -T api python -m seed.hartwood_joinery

      - name: Start search-worker and wait for the API
        run: |
          docker compose up -d search-worker
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q ok; then echo "api ready"; exit 0; fi
            echo "waiting for api ($i)…"; sleep 2
          done
          echo "api did not become ready"; docker compose logs api; exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # A production build served with `next start`: no on-demand compilation,
      # so the first navigation of each route is not a cold compile (the cause
      # of several click-before-hydration races seen against `next dev`).
      # NEXT_PUBLIC_* values are inlined at build time, so .env is exported
      # first; API_URL points at the published port instead of the compose name.
      - name: Build & start web
        working-directory: apps/web
        run: |
          set -a; . ../../.env; set +a
          export API_URL=http://localhost:8000
          pnpm build
          nohup pnpm exec next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200" ]; then echo "web ready"; exit 0; fi
            sleep 2
          done
          echo "web did not become ready"; cat /tmp/web.log; exit 1

      - name: Wait for the search index
        # Not fatal: the two search specs skip on 503, but a slow first index
        # should not turn them into skips when the stack is healthy.
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cj -H 'content-type: application/json' \
              -d '{"workspace_slug":"hartwood-joinery","email":"rin.park@hartwood.test","password":"hartwood-dev"}' http://localhost:3000/api/auth/login)
            hits=$(curl -s -b /tmp/cj 'http://localhost:3000/api/search?q=297830' | grep -c 297830 || true)
            if [ "$code" = "200" ] && [ "$hits" -gt 0 ]; then echo "search index ready"; exit 0; fi
            sleep 2
          done
          echo "search index not ready — search specs may skip"; exit 0

      # The browser download is cached per Playwright version (the lockfile
      # pins it). System libraries are not part of the cache, so a hit still
      # installs those.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install-deps chromium

      # Failures here are the result, not an error: the summary step reads the reports.
      - name: Run Playwright, 3 workers (run 1)
        continue-on-error: true
        working-directory: apps/web
        env:
          CI: "true"
          PW_BASE_URL: http://localhost:3000
          PW_WORKERS: "3"
          PW_RETRIES: "0"
          PW_JSON_REPORT: playwright-parallel-1.json
        run: pnpm exec playwright test

      - name: Run Playwright, 3 workers (run 2, same database)
        continue-on-error: true
        working-directory: apps/web
        env:
          CI: "true"
          PW_BASE_URL: http://localhost:3000
          PW_WORKERS: "3"
          PW_RETRIES: "0"
          PW_JSON_REPORT: playwright-parallel-2.json
        run: pnpm exec playwright test

      - name: Which files can run in parallel
        if: always()
        working-directory: apps/web
        run: python3 ../../scripts/playwright_failures.py playwright-parallel-1.json playwright-parallel-2.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-parallel-experiment
          path: apps/web/playwright-parallel-*.json
          retention-days: 14
          if-no-files-found: ignore
